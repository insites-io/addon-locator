mutation create_my_location($uuid: String!, $status: String!, $location_name: String) {
  items: record_create(
    record: {
      table: "modules/insites_locator/location"
      properties: [
        { name: "uuid", value: $uuid }
        { name: "status", value: $status }
        { name: "location_name", value: $location_name }
      ]
    }
  ) {
    id
    properties
  }
}
