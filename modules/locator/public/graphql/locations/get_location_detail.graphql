query get_location_detail($slug: String) {
  items: records(
    per_page: 1
    filter: {
      table: { value: "modules/insites_locator/location" }
      deleted_at: { exists: false }
      properties: [{ name: "slug", value: $slug }]
    }
  ) {
    results {
      id
      location_name: property(name: "location_name")
      slug: property(name: "slug")
      short_description: property(name: "short_description")
      long_description: property(name: "long_description")
      address_1: property(name: "address_1")
      address_2: property(name: "address_2")
      suburb: property(name: "suburb")
      state: property(name: "state")
      postcode: property(name: "postcode")
      country: property(name: "country")
      phone_number: property(name: "phone_number")
      phone_country_code: property(name: "phone_country_code")
      email: property(name: "email")
      website: property(name: "website")
      facebook_link: property(name: "facebook_link")
      twitter_link: property(name: "twitter_link")
      instagram_link: property(name: "instagram_link")
      linkedin_link: property(name: "linkedin_link")
      youtube_link: property(name: "youtube_link")
      location_image: property_upload(name: "location_image") {
        url
        file_name
      }
      image_1: property_upload(name: "image_1") {
        url
        file_name
      }
      category: related_record(
        table: "modules/insites_locator/category"
        join_on_property: "category_uuid"
        foreign_property: "uuid"
      ) {
        name: property(name: "category_name")
        slug: property(name: "slug")
      }
    }
  }
}
