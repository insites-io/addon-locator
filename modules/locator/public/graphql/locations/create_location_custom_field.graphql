mutation create_location_custom_field($user_uuid: String!, $location_uuid: String!) {
  items: record_create(
    record: {
      table: "modules/ins_locator/location_custom_field"
      properties: [
        { name: "user_uuid", value: $user_uuid }
        { name: "location_uuid", value: $location_uuid }
      ]
    }
  ) {
    id
    properties
  }
}
